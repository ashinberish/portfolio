<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Ashin Berish — portfolio" />
    <meta name="theme-color" content="#fde7d3" />
    <title>Ashin Berish</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>

    <main class="overlay">
      <h1 class="name">Ashin Berish</h1>
      <p class="role">Software Engineer</p>
    </main>

    <button
      class="daynight"
      type="button"
      role="switch"
      aria-checked="false"
      aria-label="Night mode"
      title="Follows your local time — flip to change"
    >
      <svg class="icon sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4.5" />
        <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" />
      </svg>
      <svg class="icon moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" />
      </svg>
      <span class="knob"></span>
    </button>

    <nav class="links">
      <a href="https://github.com/ashinberish" target="_blank" rel="noopener">GitHub</a>
    </nav>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
